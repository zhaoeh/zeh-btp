spring:
  application:
    name: zeh-ai-boot
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b
      embedding:
        model: nomic-embed-text

app:
  ai:
    knowledge:
      # false 时应用可在 Ollama 未启动的情况下正常启动，再调用 /rag/knowledge/reload 手动入库。
      initialize-on-startup: false
    rag:
      top-k: 4
      similarity-threshold: 0.65

logging:
  level:
    # 仅记录阶段、模型和 token，不记录用户原文，避免敏感信息进入日志。
    com.ai.advisor.AiLifecycleLoggerAdvisor: INFO
